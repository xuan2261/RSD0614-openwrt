name: build-initramfs

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel build jobs
        required: true
        default: '4'
        type: choice
        options: ['1', '2', '3', '4']
  push:
    branches: [main]
    paths:
      - '.github/build-trigger'

permissions:
  contents: read

concurrency:
  group: rsd0614-initramfs-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BUILDER_IMAGE: rsd0614-openwrt-builder:ci
      WORK_VOLUME: rsd0614-openwrt-${{ github.run_id }}-${{ github.run_attempt }}
      OUT_DIR: ${{ github.workspace }}/ci-out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk status before build
        run: df -h

      - name: Cache pinned builder image
        id: cache-builder
        uses: actions/cache@v4
        with:
          path: ~/.cache/rsd0614-builder
          key: rsd0614-builder-${{ hashFiles('Dockerfile', 'apt-bootstrap.sh') }}-20260901T000000Z

      - name: Cache OpenWrt upstream downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/rsd0614-openwrt-cache/dl
          key: rsd0614-dl-${{ hashFiles('SOURCE_LOCK.json', 'seed-rsd0614-initramfs.config') }}
          restore-keys: |
            rsd0614-dl-

      - name: Cache OpenWrt host and toolchain seed
        uses: actions/cache@v4
        with:
          path: ~/.cache/rsd0614-openwrt-cache/seed
          key: rsd0614-tc-v1-${{ hashFiles('Dockerfile', 'apt-bootstrap.sh') }}-${{ hashFiles('SOURCE_LOCK.json', 'seed-rsd0614-initramfs.config') }}
          restore-keys: |
            rsd0614-tc-v1-${{ hashFiles('Dockerfile', 'apt-bootstrap.sh') }}-
            rsd0614-tc-v1-

      - name: Load or build pinned builder image
        run: |
          if [ -s "$HOME/.cache/rsd0614-builder/builder.tar.zst" ]; then
            zstd -dc "$HOME/.cache/rsd0614-builder/builder.tar.zst" | docker load
          else
            mkdir -p "$HOME/.cache/rsd0614-builder"
            docker build \
              --platform=linux/amd64 \
              --progress=plain \
              --pull \
              --build-arg DEBIAN_SNAPSHOT=20260901T000000Z \
              -t "$BUILDER_IMAGE" .
            docker save "$BUILDER_IMAGE" | zstd -T0 -3 -f -o "$HOME/.cache/rsd0614-builder/builder.tar.zst"
          fi

      - name: Record builder image identity
        run: echo "BUILDER_IMAGE_ID=$(docker image inspect "$BUILDER_IMAGE" --format '{{.Id}}')" >> "$GITHUB_ENV"

      - name: Builder smoke test
        run: |
          docker run --rm --platform=linux/amd64 --network=none "$BUILDER_IMAGE" \
            sh -c 'set -eu; test "$(id -u)" = 1000; python2 --version; python3 --version; git --version; command -v gcc; command -v make; command -v flock; cat /opt/rsd0614/debian-snapshot.txt'

      - name: Preflight inside builder
        run: |
          docker run --rm --platform=linux/amd64 --network=none --user 1000:1000 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/port,readonly" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --workdir /tmp \
            "$BUILDER_IMAGE" python3 /port/run_tests.py

      - name: Prepare isolated build volume and output
        run: |
          docker volume create --label rsd0614.work=github-actions "$WORK_VOLUME"
          docker run --rm --platform=linux/amd64 --network=none --user 0:0 \
            --mount "type=volume,source=$WORK_VOLUME,target=/work" \
            "$BUILDER_IMAGE" sh -c 'set -eu; chown 1000:1000 /work; chmod u+rwx /work'
          mkdir -p "$OUT_DIR" ~/.cache/rsd0614-openwrt-cache/{dl,seed}
          chmod 0777 "$OUT_DIR"
          chmod -R 0777 ~/.cache/rsd0614-openwrt-cache

      - name: Build RSD0614 initramfs
        run: |
          docker run --rm --platform=linux/amd64 --user 1000:1000 \
            --mount "type=volume,source=$WORK_VOLUME,target=/work" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/port,readonly" \
            --mount "type=bind,source=$OUT_DIR,target=/out" \
            -v "$HOME/.cache/rsd0614-openwrt-cache:/cache" \
            -e CACHE_DIR=/cache \
            --env "JOBS=${{ inputs.jobs || '4' }}" \
            --env "BUILDER_IMAGE_ID=$BUILDER_IMAGE_ID" \
            --env "PROJECT_COMMIT=$GITHUB_SHA" \
            --workdir /work \
            "$BUILDER_IMAGE" bash /port/build-rsd0614-initramfs.sh

      - name: Summarize result
        if: always()
        run: |
          echo '### RSD0614 build' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$OUT_DIR/BUILD_RESULT.txt" ]; then
            cat "$OUT_DIR/BUILD_RESULT.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$OUT_DIR/STATUS.txt" ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            cat "$OUT_DIR/STATUS.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          df -h >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsd0614-initramfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup build volume
        if: always()
        run: docker volume rm -f "$WORK_VOLUME" || true
